    <stop offset="0" stop-color="#8BCF45"/><stop offset="1" stop-color="#16834A"/>
  </linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F0F8EE"/>
  </linearGradient>
</defs>
<!-- leaves behind the receipt -->
