<rect x="330" y="425" width="170" height="17" rx="8.5" fill="#A8C9A1"/>
<rect x="330" y="466" width="125" height="17" rx="8.5" fill="#A8C9A1"/>
<rect x="330" y="507" width="155" height="17" rx="8.5" fill="#A8C9A1"/>
<!-- sparkle -->
<path d="M220 250 L220 220 M205 235 H235" stroke="#7BBE3E" stroke-width="10" stroke-linecap="round"/>
<!-- wordmark -->
<text x="450" y="725" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="100" font-weight="800" letter-spacing="-4">
<tspan fill="#075D3F">Kas </tspan><tspan fill="#63AD35">Mudah</tspan>
</text>
