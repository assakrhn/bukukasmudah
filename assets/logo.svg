<!-- receipt body -->
<path d="M285 190 Q285 155 322 155 H575 Q610 155 610 190 V570 L575 596 L540 570 L505 596 L470 570 L435 596 L400 570 L365 596 L330 570 L295 596 Q270 600 270 570 V190 Q270 155 305 155" fill="url(#paper)" stroke="#08744A" stroke-width="20" stroke-linejoin="round"/>
